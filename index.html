<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="简约、可交互的 React 组件。通过 shadcn 安装源码，在自己的项目中自由修改。" />
    <meta name="color-scheme" content="light dark" />
    <title>Asharca UI — React 组件源码</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%mark.svg" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="%BASE_URL%llms.txt" />
    <script>
      try {
        const preference = localStorage.getItem('asharca-theme') || 'system';
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/main.tsx"></script>
  </body>
</html>
