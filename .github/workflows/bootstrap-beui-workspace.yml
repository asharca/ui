name: Prepare beUI workspace baseline
on:
  push:
    branches: [rebuild/beui-workspace]
    paths: [.github/workflows/bootstrap-beui-workspace.yml]
permissions:
  contents: write
concurrency:
  group: bootstrap-beui-workspace
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'asharca/ui' && github.ref == 'refs/heads/rebuild/beui-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Archive old refs and import the pinned upstream tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch origin main feat/beui-agent-components
          test "$(git rev-parse origin/main)" = d40773d2c39ddf8b216b9d0851f80eb192b7fc09
          test "$(git rev-parse origin/feat/beui-agent-components)" = a2a90e5879e05378a661ca8ec0b6c8ea8a56c4ab
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin d40773d2c39ddf8b216b9d0851f80eb192b7fc09:refs/tags/archive/pre-beui-rebuild-main-2026-09-24 a2a90e5879e05378a661ca8ec0b6c8ea8a56c4ab:refs/tags/archive/pre-beui-rebuild-agents-2026-09-24
          git fetch --depth=1 https://github.com/starc007/ui-components.git 1e23f4b10a404c17d9649086cf561e152527e2de
          git archive FETCH_HEAD | gzip > "$RUNNER_TEMP/review/beui-upstream.tar.gz"
          git read-tree --reset -u FETCH_HEAD
          # Do not inherit upstream deployment destinations or credentials.
          rm -rf .github/workflows
          cat > UPSTREAM.md <<'EOF'
          # Asharca workspace on beUI

          Source baseline: starc007/ui-components@1e23f4b10a404c17d9649086cf561e152527e2de (MIT).
          This replaces the previous Vite/Registry application with the upstream Next.js/Bun project.
          The GitHub repository identity is retained; importing a source tree does not establish GitHub's fork-network metadata.
          The workspace additions will be kept under components/workspace and the existing beUI catalog.

          Previous snapshots:
          - archive/pre-beui-rebuild-main-2026-09-24: d40773d2c39ddf8b216b9d0851f80eb192b7fc09
          - archive/pre-beui-rebuild-agents-2026-09-24: a2a90e5879e05378a661ca8ec0b6c8ea8a56c4ab

          Upstream deployment workflows are intentionally not enabled in this repository.
          EOF
          git add -A
          git commit -m 'refactor: replace the previous UI with the pinned beUI source tree'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/rebuild/beui-workspace
          git archive HEAD | gzip > "$RUNNER_TEMP/review/beui-baseline.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/review/baseline-commit.txt"
      - name: Install the upstream development environment
        run: |
          bun install --frozen-lockfile --ignore-scripts
          tar -czf "$RUNNER_TEMP/review/beui-node-modules.tar.gz" node_modules
          cp "$(command -v bun)" "$RUNNER_TEMP/review/bun"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beui-workspace-baseline
          path: ${{ runner.temp }}/review
          compression-level: 0
          retention-days: 7
