name: Prepare documentation metadata
on:
  push:
    branches: [chore/docs-metadata-prepare]
    paths: [.github/workflows/prepare-doc-metadata.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm add --save-dev --save-exact --ignore-scripts react-docgen-typescript@2.4.0
      - name: Inspect real component API extraction using beUI's parser
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';
          import docgen from 'react-docgen-typescript';
          import { catalog } from './registry/catalog.mjs';
          const config = ts.readConfigFile('tsconfig.json', ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(config.config, ts.sys, process.cwd());
          const files = catalog.map(item => path.resolve(`registry/ui/${item.slug}.tsx`));
          const program = ts.createProgram(files, parsed.options);
          const parser = docgen.withDefaultConfig({shouldExtractLiteralValuesFromEnum: true, shouldRemoveUndefinedFromOptional: true, savePropValueAsString: true, propFilter: () => true});
          const docs = parser.parseWithProgramProvider(files, () => program);
          fs.writeFileSync('/tmp/docgen-inspection.json', JSON.stringify(docs, null, 2));
          console.log('Extracted API entries:', docs.length);
          for (const item of catalog) {
            const matches = docs.filter(doc => doc.filePath.endsWith(`/ui/${item.slug}.tsx`));
            console.log(item.slug, matches.map(doc => `${doc.displayName}(${Object.keys(doc.props).length})`).join(', '));
          }
          NODE
      - name: Store lockfile blob, without updating any branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { data } = await github.rest.git.createBlob({...context.repo, content: fs.readFileSync('pnpm-lock.yaml', 'utf8'), encoding:'utf-8'});
            core.notice(`DOCGEN_LOCK_BLOB=${data.sha}`);
      - name: Prepare source and inspection archive
        run: |
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./.github/workflows/prepare-doc-metadata.yml' -czf /tmp/ui-docs-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-source-inspection
          path: |
            /tmp/ui-docs-source.tar.gz
            /tmp/docgen-inspection.json
          retention-days: 2
