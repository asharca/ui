# Temporary read-only build bootstrap for the showcase rewrite review.
name: review-bootstrap
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  bundle:
    if: github.head_ref == 'feat/transitions-showcase-rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle reproducible local tooling
        run: |
          mkdir -p "$RUNNER_TEMP/review-bootstrap"
          tar -cf "$RUNNER_TEMP/review-bootstrap/dependencies.tar" node_modules
          git archive --format=tar HEAD > "$RUNNER_TEMP/review-bootstrap/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: review-bootstrap
          path: ${{ runner.temp }}/review-bootstrap/
          retention-days: 1
