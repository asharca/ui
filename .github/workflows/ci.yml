name: Validate beUI workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: beui-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: TypeScript, Biome and Registry
        run: bun run check
      - name: Upstream and workspace unit tests
        run: bun test
      - name: Public MCP typecheck
        working-directory: mcp
        run: |
          bun install --frozen-lockfile
          bun run typecheck
