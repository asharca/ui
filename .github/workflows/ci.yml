name: Validate source registry
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-registry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_PATH: /ui/
      SITE_URL: https://asharca.github.io/ui/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Record initial lockfile blob
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { data } = await github.rest.git.createBlob({ ...context.repo, content: fs.readFileSync('pnpm-lock.yaml', 'utf8'), encoding: 'utf-8' });
            core.notice(`LOCKFILE_BLOB_SHA=${data.sha}`);
      - name: Registry, lint, unit tests and site build
        run: pnpm check
      - name: Real shadcn consumer installation
        run: pnpm test:consumer
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser interactions and responsive screenshots
        run: pnpm test:browser
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-registry-review
          path: |
            dist
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
