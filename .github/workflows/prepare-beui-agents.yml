name: Prepare pinned beUI agent sources
on:
  push:
    branches: [feat/beui-agent-components]
    paths: [.github/workflows/prepare-beui-agents.yml]
concurrency:
  group: prepare-beui-agents
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'asharca/ui' && github.ref == 'refs/heads/feat/beui-agent-components'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Read pinned upstream source without executing it
        run: |
          mkdir -p /tmp/beui /tmp/review
          git -C /tmp/beui init -q
          git -C /tmp/beui fetch --depth=1 https://github.com/starc007/ui-components.git 1e23f4b10a404c17d9649086cf561e152527e2de
          git -C /tmp/beui checkout -q FETCH_HEAD
          tar -C /tmp/beui -czf /tmp/review/beui-source.tar.gz components lib app/globals.css package.json LICENSE AGENTS.md
          git archive HEAD | gzip > /tmp/review/asharca-source.tar.gz
      - name: Archive and remove the explicitly superseded branch snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          expected = dict(line.split() for line in '''chore/docs-metadata-prepare c0d7bd38e9fc87d12a79e4c2ee71682e1d635a78
          docs/component-update-guide 05d96e8de3822dbb01b6deac7b24c2a3b0b0940b
          feat/beui-component-refinement 9a986aea34beec7aebd03f938103ca1a9e0dc17b
          feat/component-studio-redesign d3cb97280033c55fe37a2031c2217294d5a61e72
          feat/data-table-selection-toolbar 205bf0e332814c1fbd00f137ba6f48254cfd32db
          feat/release-ui-0.2.2 fe5bfa038695a1bbab6cb552e651aa7a11887220
          feat/remove-composer-top-gap 972831ae27f38b02f8f5843b20604bc416dd4363
          feat/restore-component-catalog 15f1f15f6aad741fb58e4d8173e2c1c22e26da1d
          feat/table-selection-rich-chat e9c884d900570e004d8019fe1e8371c92cbb953f
          feat/transitions-showcase-rewrite 76b05cc02d7a9846a1f18a374503814e001df29b
          feat/workspace-shell 9709a2b17218aadf84ccaccee21b6d8c928e4115
          fix/docs-navigation-api-actions 55b0ffb58293d10ea4083b53dd4801cb104f745e
          fix/registry-directory-readiness a71d66d91475d0cbafdd804c2d159f29a21d8002
          fix/sidebar-collapse-motion a6964f6519804414d918e1a7466a76bb158d461c
          fix/sidebar-compact-spacing-transition 5fa15778ce4e4dbf54dcdc879c45a07a191d758e
          fix/ui-reliability-and-showcase 202be77e3faca73bceb6b34b3001bef90f0a82d8
          fix/workspace-alignment-detached-tabs 83c0eba33a7285cf3c9607d4d1164211999d913e
          fix/workspace-showcase-navigation 532a3c78de076f07ec4933a34cc7c887b95c5548
          fix/workspace-sidebar-motion f5987d37d71dd7810d05dd59ce40ac0d697333b8'''.splitlines())
          def api(path, method='GET', body=None):
              request = urllib.request.Request('https://api.github.com/repos/asharca/ui' + ('/' + path if path else ''), method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          branches = api('branches?per_page=100')
          assert len(branches) < 100
          default = api('')['default_branch']
          records = []
          for branch in branches:
              name, sha = branch['name'], branch['commit']['sha']
              if name not in expected: continue
              assert name != default and name != 'main' and not branch['protected']
              assert sha == expected[name], 'Concurrent changes to ' + name
              archive = 'archive/2026-09-24/' + name
              try: api('git/refs', 'POST', {'ref':'refs/tags/' + archive, 'sha':sha})
              except urllib.error.HTTPError as error:
                  if error.code != 422: raise
                  assert api('git/ref/tags/' + urllib.parse.quote(archive, safe=''))['object']['sha'] == sha
              ref = api('git/ref/heads/' + urllib.parse.quote(name, safe=''))
              assert ref['object']['sha'] == sha, 'Concurrent update; preserved branch'
              api('git/refs/heads/' + urllib.parse.quote(name, safe=''), 'DELETE')
              records.append({'branch':name, 'sha':sha, 'archiveTag':archive})
          with open('/tmp/review/branch-archive.json','w') as file: json.dump(records,file,indent=2)
          print('Archived and deleted', len(records), 'branches; main and new work branch retained.')
          PY
      - name: Install the downstream test environment
        run: |
          pnpm install --frozen-lockfile
          pnpm add --ignore-scripts --save-exact shiki@4.2.0 react-use-measure@2.1.7
          tar -czf /tmp/review/test-environment.tar.gz node_modules package.json pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beui-agent-source-and-tools
          path: /tmp/review
          retention-days: 7
          compression-level: 0
