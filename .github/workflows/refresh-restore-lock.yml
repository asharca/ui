name: Refresh restoration dependency lock
on:
  push:
    branches: [feat/restore-component-catalog]
    paths: [.github/workflows/refresh-restore-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/feat/restore-component-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit only the generated lockfile to the restoration branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const branch = 'feat/restore-component-catalog';
            const path = 'pnpm-lock.yaml';
            const current = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
            if (Array.isArray(current.data) || !current.data.sha) throw new Error('Lockfile metadata unavailable');
            const result = await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, branch, path, sha: current.data.sha,
              content: fs.readFileSync(path).toString('base64'),
              message: 'build: lock restored table chart and Markdown dependencies'
            });
            core.notice(`LOCK_COMMIT=${result.data.commit.sha}`);
