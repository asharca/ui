name: Retire legacy release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-legacy-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: read
jobs:
  retire:
    if: github.repository == 'asharca/ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete only the user-requested legacy release, retain its Git tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api repos/asharca/ui/releases --paginate --jq '.[] | select(.id == 391293072 and .tag_name == "ui-v0.2.3") | .id')
          if [ -n "$id" ]; then
            gh api --method DELETE "repos/asharca/ui/releases/$id"
            echo 'Deleted Release ui-v0.2.3 (391293072); no Git tags were deleted.'
          else
            echo 'The selected legacy release is already absent.'
          fi
          gh api repos/asharca/ui/releases --paginate --jq '.[] | {id, tag_name, name}'
      - name: Inspect existing Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/asharca/ui/pages --jq '{html_url,build_type,status,source}'
      - name: Capture tracked source for publication compatibility checks
        if: always()
        run: git archive --format=tar.gz --output=/tmp/pages-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-source
          path: /tmp/pages-source.tar.gz
          retention-days: 1
