name: Apply reviewed native beUI workspace changes
on:
  push:
    branches: [rebuild/beui-workspace]
    paths: [.github/workflows/finish-workspace.yml]
permissions:
  contents: write
concurrency:
  group: finish-beui-workspace
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'asharca/ui' && github.ref == 'refs/heads/rebuild/beui-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply source only; workflow writes are managed separately
        run: |
          python3 - <<'PY'
          import gzip, hashlib, pathlib, subprocess, shutil
          source = b''.join(pathlib.Path(f'.workspace-transfer/part-{i}.gz').read_bytes() for i in range(7))
          patch = gzip.decompress(source)
          assert hashlib.sha256(patch).hexdigest() == '257b5012bbe09f38e4d71ffcfe95abccbfa5bda7deef2439faae43f2b335eef4'
          subprocess.run(['git','apply','--index','--exclude=.github/workflows/ci.yml','-'], input=patch, check=True)
          shutil.rmtree('.workspace-transfer')
          # Do not modify workflows with this contents-only Actions token.
          # CI was added by the authorized repository connector; this helper
          # will also be removed through that connector after the source push.
          readme = pathlib.Path('README.md')
          readme.write_text(readme.read_text() + '\n## beUI 官方 Skill\n\n```bash\nnpx skills add starc007/ui-components --skill beui\n```\n\n上游 Skill 提供 beUI 组件知识；新增工作区接口请同时阅读本仓库 docs/workspace.md。\n')
          test = pathlib.Path('e2e/workspace.e2e.mjs')
          value = test.read_text()
          assert value.count(".toHaveAttribute('aria-disabled', 'true')") == 1
          test.write_text(value.replace(".toHaveAttribute('aria-disabled', 'true')", '.toBeDisabled()'))
          signature = pathlib.Path('lib/signature.ts')
          value = signature.read_text()
          needle = '  return `${SITE_URL}${componentPath(categorySlug, pageSlug)}`;'
          assert needle in value
          signature.write_text(value.replace(needle, '''  const workspace = categorySlug === "blocks" && ["workspace-shell", "workspace-tab-bar"].includes(pageSlug);
            const origin = workspace ? (process.env.NEXT_PUBLIC_SITE_URL || "http://localhost:3000").replace(/\\/$/, "") : SITE_URL;
            return `${origin}${componentPath(categorySlug, pageSlug)}`;'''))
          PY
      - name: Install the browser test runner and verify the native source
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun add --dev --exact --ignore-scripts @playwright/test@1.63.0
          bun run check
      - name: Commit the source only to the requested rebuild branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git commit -m 'feat(workspace): compose the Asharca shell and tabs from native beUI components'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/rebuild/beui-workspace
          git rev-parse HEAD > "$RUNNER_TEMP/workspace-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-source-commit
          path: ${{ runner.temp }}/workspace-commit.txt
