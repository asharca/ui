name: publish-ui

on:
  push:
    tags:
      - 'ui-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit and version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const manifest = JSON.parse(readFileSync('package.json', 'utf8')); if (manifest.name !== '@asharca/ui' || manifest.license !== 'MIT') throw new Error('Unexpected package identity'); if (process.env.TAG_NAME !== 'ui-v' + manifest.version) throw new Error('Expected ui-v' + manifest.version);"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:package
      # npm handles OIDC publishing; pnpm manages development and dependencies.
      - run: npm publish --access public --ignore-scripts --provenance
